[project]
name = "q-a-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AryanSonawane2004", email = "aryan.ashsona@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langsmith>=0.12.1",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
]

[project.scripts]
q-a-chatbot = "q_a_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
